<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Graffiti Resin</title>
<script>
(function(){
  var parts = location.pathname.split('/').filter(Boolean);
  var onGithub = /\.github\.io$/.test(location.hostname);
  var sub = (onGithub || parts[0] === 'calculator') && parts.length;   // site lives in a sub-folder
  var base = sub ? '/' + parts[0] + '/' : '/';
  var seg = (sub ? parts[1] : parts[0]) || '';
  var extra = location.search.replace(/^\?/, '&');
  location.replace(base + (seg ? '?system=' + encodeURIComponent(seg) + extra : location.search));
})();
</script>
</head>
<body></body>
</html>
